spring.application.name=gridwatch-core
server.port=8081
spring.datasource.url=jdbc:postgresql://localhost:5432/gridwatch
spring.datasource.username=gridwatch
spring.datasource.password=gridwatch
spring.jpa.hibernate.ddl-auto=none
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=gridwatch-core
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.i2iacademy.gridwatch.core.messaging
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.i2iacademy.gridwatch.core.messaging.TelemetryEvent
gemini.api.key=${GEMINI_API_KEY}
logging.level.com.i2iacademy.gridwatch.core.analytics.service=DEBUG